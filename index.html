<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' https://docs.google.com https://*.googleusercontent.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Tally</title>
<meta name="description" content="Snap any receipt and see what you spent on, item by item. Local-only money manager: no account, no ads.">
<meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app"><p class="loading">Tally…</p></div>
<input type="file" id="scan-input" accept="image/*" multiple hidden>
<div id="sr-status" class="sr" role="status" aria-live="polite"></div>
<noscript>Tally needs JavaScript to run.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
